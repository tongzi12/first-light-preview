<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FIRST LIGHT preview</title>
<style>
  html,body{margin:0;background:#000;color:#ddd;font:13px/1.4 monospace;overflow:hidden}
  #c{display:block}
  #bar{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);padding:6px 10px;display:flex;gap:10px;align-items:center}
  input[type=range]{flex:1}
  #st{min-width:180px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="play">▶</button>
  <span id="st">0.0 / 106.0 s</span>
  <input id="seek" type="range" min="0" max="106" step="0.1" value="0">
  <span id="err" style="color:#f66"></span>
</div>
<script type="module">
const FPS = 60, DUR = 106;
const cv = document.getElementById('c');
const st = document.getElementById('st'), seek = document.getElementById('seek'), playB = document.getElementById('play'), err = document.getElementById('err');
let t = 0, playing = true, ready = false, lastMs = 0;
try {
  const FL = (await import('./src/main.js')).default?.FL ?? window.FL;
  await FL.init({ w: innerWidth, h: innerHeight });
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  addEventListener('resize', () => location.reload());
  ready = true;
} catch (e) { err.textContent = 'INIT ERROR: ' + e.message; console.error(e); }

let prev = performance.now();
function loop(now) {
  if (ready) {
    const dt = (now - prev) / 1000; prev = now;
    if (playing) { t = (t + dt) % DUR; seek.value = t; }
    try { FL.frameAt(t, { samples: 2 }); } catch (e) { err.textContent = 'FRAME ERROR: ' + e.message; playing = false; }
    st.textContent = t.toFixed(1) + ' / ' + DUR + ' s  (' + lastMs + ' ms)';
  }
  requestAnimationFrame(loop);
}
playB.onclick = () => { playing = !playing; playB.textContent = playing ? '▶' : '⏸'; prev = performance.now(); };
seek.oninput = () => { t = +seek.value; };
requestAnimationFrame(loop);
</script>
</body>
</html>
